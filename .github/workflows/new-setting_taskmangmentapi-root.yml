# Production deploy: API, Hangfire, and the Angular app.
# API app is the live host behind taskmangmentapi-*.azurewebsites.net.
# Frontend app serves https://sarkha.cloud.

name: Deploy production API, Hangfire, and frontend

on:
  push:
    branches:
      - New-Setting
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish API
        run: dotnet publish TaskMangment.API/TaskMangment.API.csproj -c Release -o ./publish/api

      - name: Publish Hangfire
        run: dotnet publish TaskMangment.Hangfire/TaskMangment.Hangfire.csproj -c Release -o ./publish/hangfire

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish/api

      - name: Upload Hangfire artifact
        uses: actions/upload-artifact@v4
        with:
          name: hangfire
          path: ./publish/hangfire

  build-frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: TaskMangment.Presentation/TaskMangmentFE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: TaskMangment.Presentation/TaskMangmentFE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production
        run: npx ng build --configuration production

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: TaskMangment.Presentation/TaskMangmentFE/dist/task-manger/browser

  deploy-api:
    runs-on: windows-latest
    needs: build-dotnet
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_336E07FCBE2F496CB7FDAC9FAE6AE1FC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B70C250D85E74792B3B18109FDCB8664 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5FEAFD9677C548C3AED26D14BD401697 }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: TaskMangmentApi-root
          slot-name: Production
          package: ./package

  deploy-hangfire:
    runs-on: windows-latest
    needs: build-dotnet
    steps:
      - name: Download Hangfire artifact
        uses: actions/download-artifact@v4
        with:
          name: hangfire
          path: ./package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_336E07FCBE2F496CB7FDAC9FAE6AE1FC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B70C250D85E74792B3B18109FDCB8664 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5FEAFD9677C548C3AED26D14BD401697 }}

      - name: Deploy Hangfire
        uses: azure/webapps-deploy@v3
        with:
          app-name: taskmangment-hangfire
          slot-name: Production
          package: ./package

  deploy-frontend:
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: ./package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_336E07FCBE2F496CB7FDAC9FAE6AE1FC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B70C250D85E74792B3B18109FDCB8664 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5FEAFD9677C548C3AED26D14BD401697 }}

      - name: Deploy frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: taskmangment-Presentation
          slot-name: Production
          package: ./package
