<div class="login-page gradient-bg d-flex flex-column align-items-center justify-content-center vh-100">
 

  <!-- LOGIN CARD -->
  <div class="login-card shadow-lg rounded-4 p-4 p-md-5 bg-body">
    
    <h3 class="fw-bold mb-1 text-center">
      {{ 'LOGIN.TITLE' | translate }}
    </h3>

    <p class="text-muted text-center mb-4 fs-14">
      {{ 'LOGIN.SUBTITLE' | translate }}
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="Submit($event)">
      
      <div class="mb-3">
        <label class="form-label fw-semibold">{{ 'LOGIN.USERNAME' | translate }}</label>
        <input type="text" formControlName="username"
               class="form-control form-control-lg"
               placeholder="{{ 'LOGIN.USERNAME_PLACEHOLDER' | translate }}">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">{{ 'LOGIN.PASSWORD' | translate }}</label>
        <div class="position-relative">
          <input [type]="showPassword ? 'text' : 'password'"
                 formControlName="password"
                 class="form-control form-control-lg pe-5"
                 placeholder="{{ 'LOGIN.PASSWORD_PLACEHOLDER' | translate }}">
          <i class="fe fe-eye position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer"
             (click)="toggleVisibility()"></i>
        </div>
      </div>

      <button class="btn btn-primary btn-lg w-100 mt-2"
              [disabled]="!loginForm.valid || authservice.showLoader">
        <span *ngIf="!authservice.showLoader">{{ 'LOGIN.SUBMIT' | translate }}</span>
        <span *ngIf="authservice.showLoader" class="spinner-border spinner-border-sm"></span>
      </button>

    </form>

    <div class="text-center mt-4">
      <a routerLink="/auth/forgot-password" class="d-block mb-2">
        {{ 'LOGIN.FORGOT_PASSWORD' | translate }}
      </a>

      <span class="text-muted fs-14">
        {{ 'LOGIN.DONT_HAVE_ACCOUNT' | translate }}
        <a routerLink="#" class="fw-semibold">
          {{ 'LOGIN.REGISTER_HERE' | translate }}
        </a>
      </span>
    </div>

  </div>
