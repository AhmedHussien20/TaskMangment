<div class="login-page gradient-bg d-flex align-items-center justify-content-center vh-100">
  <div class="login-card shadow-lg rounded-4 p-4 p-md-5 bg-body" style="max-width: 400px; width: 100%;">
    
    <h3 class="fw-bold mb-4 text-center">
      {{ 'FORGOT_PASSWORD.RESET_PASSWORD' | translate }}
    </h3>

    <div *ngIf="loading" class="text-center mb-3">
      <span class="spinner-border spinner-border-sm me-2"></span> {{'FORGOT_PASSWORD.RESET_CODE_CHECK' | translate}}
    </div>

    <div *ngIf="!loading && !isTokenValid" class="text-center text-danger mb-3">
      {{ errorMessage }}
    </div>

    <form *ngIf="!loading && isTokenValid" [formGroup]="form" (ngSubmit)="submit()">
  <div class="mb-3">
    <label class="form-label fw-semibold">
      {{'FORGOT_PASSWORD.RESET_PASSWORD' | translate}}
    </label>
    <input type="password" formControlName="newPassword" class="form-control form-control-lg" placeholder="{{ 'FORGOT_PASSWORD.NEW_PASSWORD_PLACE_HOLDER' | translate }}">
  </div>

  <div class="mb-3">
    <label class="form-label fw-semibold">
      {{'FORGOT_PASSWORD.CONFIRM_PASSWORD' | translate}}
    </label>
    <input type="password" formControlName="confirmPassword" class="form-control form-control-lg" placeholder="{{ 'FORGOT_PASSWORD.CONFIRM_PASSWORD_PLACE_HOLDER' | translate }}">
    
    <div *ngIf="form.value.confirmPassword && form.value.newPassword !== form.value.confirmPassword" class="text-danger mt-1">
      {{ 'FORGOT_PASSWORD.PASSWORDS_NOT_MATCH' | translate }}
    </div>
  </div>

  <button class="btn btn-primary btn-lg w-100 mt-2" 
          [disabled]="form.invalid || form.value.newPassword !== form.value.confirmPassword">
    {{'FORGOT_PASSWORD.CONFIRM' | translate}}
  </button>
</form>


    <div class="text-center mt-4">
      <a routerLink="/auth/login" class="fw-semibold">{{'FORGOT_PASSWORD.GO_BACK_TO_LOGIN' | translate}}</a>
    </div>

  </div>
</div>
