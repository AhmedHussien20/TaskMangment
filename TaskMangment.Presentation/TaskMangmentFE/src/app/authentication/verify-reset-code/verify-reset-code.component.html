<div class="login-page gradient-bg d-flex align-items-center justify-content-center vh-100">
  <div class="login-card shadow-lg rounded-4 p-4 p-md-5 bg-body">

    <h3 class="fw-bold mb-1 text-center">
        {{'FORGOT_PASSWORD.VERIFY_CODE' | translate}}
    </h3>

    <p class="text-muted text-center mb-4 fs-14">
        {{'FORGOT_PASSWORD.VERIFY_NOTE' | translate}}
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="mb-3">
        <label class="form-label fw-semibold">{{'FORGOT_PASSWORD.VERIFY_CODE' | translate}}</label>
        <input
          type="text"
          formControlName="token"
          class="form-control form-control-lg"
          placeholder="{{'FORGOT_PASSWORD.6_CODE_DIGITS' | translate}}"
        />
      </div>

      <button class="btn btn-primary btn-lg w-100 mt-2" [disabled]="form.invalid">
       {{'FORGOT_PASSWORD.CONFIRM' | translate}}
      </button>

    </form>

    <div class="text-center mt-4">
      <a routerLink="/auth/login" class="d-block mb-2">{{'FORGOT_PASSWORD.GO_BACK_TO_LOGIN' | translate}}</a>
    </div>

  </div>
</div>
