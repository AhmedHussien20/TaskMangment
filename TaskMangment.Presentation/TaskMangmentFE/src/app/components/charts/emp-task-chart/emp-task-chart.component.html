<app-page-header
  [title]="title | translate"
  [title1]="breadcrumbs"
  [activeitem]="activeitem | translate">
</app-page-header>

<div class="row row-sm">
  <div class="col-md-12 col-lg-12">
    <div class="card custom-card">

      <!-- Filters -->
      <div class="card-header border-bottom-0">
        <div class="d-flex justify-content-center align-items-end gap-3 flex-wrap">

          <div class="d-flex flex-column">
            <label class="form-label small">{{ 'CHART.FROM' | translate }}</label>
            <input type="date" [(ngModel)]="fromDate" class="form-control form-control-sm">
          </div>

          <div class="d-flex flex-column">
            <label class="form-label small">{{ 'CHART.TO' | translate }}</label>
            <input type="date" [(ngModel)]="toDate" class="form-control form-control-sm">
          </div>

          <div class="d-flex flex-column" *ngIf="isAdmin">
            <label class="form-label small">{{ 'CHART.EMPLOYEES' | translate }}</label>
            <select [(ngModel)]="selectedEmployeeId" class="form-control form-control-sm">
              <option [ngValue]="undefined">{{ 'FORM.SELECT' | translate }}</option>
              <option *ngFor="let emp of employees" [ngValue]="emp.id">
                {{ emp.fullName }}
              </option>
            </select>
          </div>

          <div class="d-flex align-items-end gap-2">
            <button class="btn btn-primary btn-sm" (click)="onFilterApply()">
              {{ 'COMMON.APPLY' | translate }}
            </button>
          </div>

        </div>
      </div>

      <div class="card-body">
        <div *ngIf="isLoading" class="text-center my-3">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">{{ 'TABLE.LOADING' | translate }}</span>
          </div>
        </div>

        <div *ngIf="!isLoading" class="row">
          <!-- BAR: Tasks + % -->
          <div class="col-xl-7">
            <div class="card custom-card">
              <div class="card-header">
                <div class="card-title">{{'CHART.TASK_PERCENT' | translate}}</div>
              </div>
              <div class="card-body" style="height: 420px;">
                <spk-chartjs [type]="barChartType" [data]="barChartData" [options]="barChartOptions">
                </spk-chartjs>
              </div>
            </div>
          </div>

          <!-- PIE: StatusCounts -->
          <div class="col-xl-5">
            <div class="card custom-card">
              <div class="card-header">
                <div class="card-title">{{'CHART.TASKS_STATUS'| translate}}</div>
              </div>
              <div class="card-body" style="height: 420px;">
                <spk-echarts [echartId]="'emp-status-pie'" [options]="pieOptions"></spk-echarts>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
