<app-generic-form
  [title]="title"
  [breadcrumbs]="breadcrumbs"
  [activeitem]="activeitem"
  [formGroup]="formGroup"
  [formConfig]="formConfig"
  (formSubmit)="onSubmit($event)"> 
</app-generic-form>

<!-- Subjects List -->
<div class="card mt-3">
  <div class="card-body">
    <h6 class="card-title">{{ 'COURSE.SUBJECTS' | translate }}</h6>
    
    <!-- Add Subject Form -->
    <div [formGroup]="formGroup" class="input-group mb-3">
      <input type="text" class="form-control" formControlName="newSubject"
             placeholder="{{ 'COURSE.SUBJECT_PLACEHOLDER' | translate }}">
      <button class="btn btn-primary" type="button" (click)="addSubject()">
        {{ 'COURSE.ADD_SUBJECT' | translate }}
      </button>
    </div>

    <!-- Subjects List -->
    <div *ngIf="subjects.length > 0" class="mt-3">
      <ul class="list-group">
        <li *ngFor="let subject of subjects; let i = index" 
            class="list-group-item d-flex justify-content-between align-items-center">
          {{ subject }}
          <button class="btn btn-sm btn-outline-danger" (click)="removeSubject(i)">
            <i class="bi bi-trash"></i>
          </button>
        </li>
      </ul>
    </div>

    <div *ngIf="subjects.length === 0" class="text-muted text-center py-3">
      {{ 'COURSE.NO_SUBJECTS' | translate }}
    </div>
  </div>
</div>
