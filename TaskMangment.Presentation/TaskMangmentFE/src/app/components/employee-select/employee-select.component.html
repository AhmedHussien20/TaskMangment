<div class="d-flex flex-column">
<label *ngIf="showLabel" class="form-label">
  {{ labelKey | translate }}
</label>

  <ng-select
   style="min-width:260px"
    class="custom-ng-select"
    [items]="options"
    bindLabel="label"
    bindValue="value"
    [searchable]="true"
    [clearable]="clearable"
    [loading]="isLoading"
    [disabled]="disabled"
    [closeOnSelect]="true"
    [multiple]="false"
    [ngModel]="selectedEmployeeId"
    (ngModelChange)="onValueChange($event)"
    (open)="onOpen()"
    (scrollToEnd)="onScrollToEnd()"
    (search)="onSearch($event.term)"
    placeholder="{{ placeholderKey | translate }}"
  >

    <!-- OPTION TEMPLATE -->
    <ng-template ng-option-tmp let-item="item" let-index="index">
      <div class="d-flex align-items-center p-2">
        <img
          [src]="item.imageUrl || 'assets/images/user.png'"
        (error)="onImageError($event)"
          width="28" height="28"
          class="rounded-circle border me-2" />

        <div class="flex-grow-1">
          <div class="fw-bold">{{ item.label }}</div>
          <div *ngIf="item.mobile" class="text-muted small">📱 {{ item.mobile }}</div>
          <div *ngIf="item.email" class="text-muted small">✉️ {{ item.email }}</div>
        </div>
      </div>

      <hr *ngIf="index < options.length - 1" />
    </ng-template>

    <ng-template ng-label-tmp let-item="item">
      <div class="d-flex align-items-center">
        <img
          [src]="item.imageUrl || 'assets/images/user.png'"
          (error)="onImageError($event)"
          width="20" height="20"
          class="rounded-circle border me-2" />
        {{ item.label }}
      </div>
    </ng-template>

  </ng-select>
</div>
