<form [formGroup]="form" (ngSubmit)="onSave()">
  <div class="modal-header">
    <h5 class="modal-title">
      {{ isEdit ? ('CALENDAR.EDIT_EVENT' | translate) : ('CALENDAR.CREATE_EVENT' | translate) }}
    </h5>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
  </div>

  <div class="modal-body">

    <!-- عنوان الحدث -->
    <div class="mb-3">
      <label class="form-label">
        {{ 'CALENDAR.TITLE' | translate }} *
      </label>
      <input class="form-control" formControlName="title" />
      <div *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="text-danger fs-11">
        {{ 'FORM.REQUIRED' | translate }}
      </div>
    </div>

    <!-- وصف الحدث -->
    <div class="mb-3">
      <label class="form-label">
        {{ 'CALENDAR.DESCRIPTION' | translate }}
      </label>
      <textarea class="form-control" rows="3" formControlName="description"></textarea>
    </div>

    <!-- نوع الحدث -->
    <div class="mb-3">
      <label class="form-label">
        {{ 'CALENDAR.EVENTS_TYPE' | translate }} *
      </label>
      <select class="form-select" formControlName="eventType">
        <option *ngFor="let type of eventTypes" [ngValue]="type.value">
          {{ type.label | translate }}
        </option>
      </select>
    </div>

    <!-- التواريخ -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">
          {{ 'CALENDAR.START_DATE' | translate }} *
        </label>
        <input type="datetime-local" class="form-control" formControlName="startDate" />
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">
          {{ 'CALENDAR.END_DATE' | translate }}
        </label>
        <input type="datetime-local" class="form-control" formControlName="endDate" />
      </div>
    </div>

    <!-- التذكير -->
    <div class="mb-3">
      <label class="form-label">{{ 'CALENDAR.REMINDER' | translate }}</label>
      <select class="form-select" formControlName="reminder">
        <option *ngFor="let opt of reminderOptions" [value]="opt.value">
          {{ opt.label | translate }}
        </option>
      </select>
    </div>

  <!-- خيار كل اليوم -->
<div class="form-check form-switch mb-3 d-flex align-items-center gap-2">
  <input
    class="form-check-input"
    type="checkbox"
    formControlName="allDay"
    id="allDay"
    style="transform: scale(1.5);">
  <label class="form-check-label fw-semibold fs-15 mb-0" for="allDay">
    {{ 'CALENDAR.ALL_DAY' | translate }}
  </label>
</div>

    <!-- خيار Public -->
<div class="form-check form-switch mb-3 d-flex align-items-center gap-2" *ngIf="canSetPublic">
  <input
    class="form-check-input"
    type="checkbox"
    formControlName="public"
    id="publicEvent"
    style="transform: scale(1.5);">

  <i class="ti ti-world fs-20 text-primary"></i>

  <label class="form-check-label fw-semibold fs-15 mb-0" for="publicEvent">
    {{ 'CALENDAR.PUBLIC_EVENT' | translate }}
  </label>
</div>



  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-light" (click)="activeModal.dismiss()">
      {{ 'FORM.BACK' | translate }}
    </button>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving">
      <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
      {{ isEdit ? ('FORM.UPDATE' | translate) : ('FORM.SAVE' | translate) }}
    </button>
  </div>
</form>
