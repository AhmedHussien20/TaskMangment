<app-page-header [title]="title | translate" [title1]="breadcrumbs" [activeitem]="activeitem | translate">
</app-page-header>

<div class="row row-sm">
  <div class="col-md-12 col-lg-12">
    <div class="card custom-card">

      <div>

    

        <!-- TABLE -->
        <div>

          <app-generic-table
            [title]="title"
            [breadcrumbs]="breadcrumbs"
            [activeitem]="activeitem"
            [labels]="labels"
            [columns]="columns"
            [data]="rows"
            [entries]="entries"
            [page]="page"
            [totalItems]="totalItems"
            [showAddButton]="true"
            [addButtonLabel]="'OFFER.ADD' | translate"     
            (addClick)="openAdd(offerModal)"
            [showEditButton]="true"
            (edit)="openEdit($event, offerModal)"
            [showFilters]="true"
            [searchCriteria]="searchCriteria"
            [onSearch]="applyFilters.bind(this)"
            (pageChange)="onPageChange($event)"
            (entriesChange)="onEntriesChange($event)"
            [showDeleteButton]="true"
            (delete)="confirmDelete($event)"             >
          </app-generic-table>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL TEMPLATE -->
<ng-template #offerModal let-modal>
  <div class="modal-header">
    <h6 class="modal-title">
      {{ isEdit ? ('OFFER.EDIT' | translate) : ('OFFER.ADD' | translate) }}
    </h6>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <app-offer-create-update
      *ngIf="key"
      [isEdit]="isEdit"
      [offerId]="selectedOfferId"
      (formSubmitted)="onFormSubmitted()">
    </app-offer-create-update>
  </div>
</ng-template>
