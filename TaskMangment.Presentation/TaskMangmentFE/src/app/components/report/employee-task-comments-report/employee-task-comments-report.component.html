<app-page-header [title]="title | translate" [title1]="breadcrumbs" [activeitem]="activeitem | translate">
</app-page-header>

<div class="row row-sm">
  <div class="col-md-12 col-lg-12">
    <div class="card custom-card">
      <!-- Filters -->
      <div class="card-header border-bottom-0">
        <div class="d-flex justify-content-center gap-3 flex-wrap">

          <div *ngIf="isAdmin" class="d-flex flex-column">
            <app-employee-ng-select [(selectedEmployeeId)]="selectedEmployeeId" (selectedEmployeeIdChange)="onEmployeeChange()">
            </app-employee-ng-select>
          </div>

          <div class="d-flex flex-column">
            <label class="form-label small">{{ 'REPORTS.TASK' | translate }}</label>
            <select class="form-select form-select-sm" [(ngModel)]="selectedTaskId" [disabled]="!selectedEmployeeId">
              <option [ngValue]="undefined">{{ 'COMMON.SELECT' | translate }}</option>
              <option *ngFor="let t of tasks" [ngValue]="t.taskId">[{{ t.taskId }}] {{ t.title }}</option>
            </select>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-primary btn-sm" (click)="onFilterApply()">
              {{ 'COMMON.APPLY' | translate }}
            </button>
          </div>

        </div>
      </div>

      <!-- Table -->
      <div class="card-body pt-2">
        <div *ngIf="isLoading" class="text-center my-3">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">{{ 'TABLE.LOADING' | translate }}</span>
          </div>
        </div>

        <div *ngIf="!isLoading">
          <app-generic-table
            [title]="title"
            [columns]="columns"
            [data]="rows"
            [entries]="entries"
            [page]="page"
            [showFilters]="false"
            [showPagination]="false"
            [totalItems]="totalItems"
            (pageChange)="onPageChange($event)"
            (entriesChange)="onEntriesChange($event)"
            [showExportPdf]="true"
            (exportPdfClick)="onExportPdf()"
            [showExportExcel]="false"
            [showExportReportExcel]="true"
            (exportExcelClick)="onExportExcel()"
            [rowClickable]="true"
            [rowClickableCondition]="checkRowClickable"
            (edit)="onEdit($event)">
          </app-generic-table>
        </div>
      </div>
    </div>
  </div>
</div>
