<app-page-header [title]="title | translate" [title1]="breadcrumbs" [activeitem]="activeitem | translate">
</app-page-header>

<div class="row row-sm">
  <div class="col-md-12 col-lg-12">
    <div class="card custom-card">

      <!-- Filters -->
      <div class="card-header border-bottom-0">
        <div class="d-flex justify-content-center align-items-end gap-3">
          <div *ngIf="isAdmin" class="d-flex flex-column">
            <app-employee-ng-select [(selectedEmployeeId)]="selectedEmployeeId">
            </app-employee-ng-select>
          </div>
          

          <div class="d-flex align-items-end gap-2" *ngIf="isAdmin">
            <button class="btn btn-primary btn-sm" (click)="onFilterApply()">
              {{ 'COMMON.APPLY' | translate }}
            </button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card-body pt-2">
        <div *ngIf="isLoading" class="text-center my-3">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">{{ 'TABLE.LOADING' | translate }}</span>
          </div>
        </div>

        <div *ngIf="!isLoading">
          <app-generic-table [title]="title" [columns]="columns" [data]="rows" [entries]="entries" [page]="page"
            [showFilters]="false" [showPagination]="false" [totalItems]="totalItems" [showExportPdf]="true"
            (exportPdfClick)="onExportPdf()" (pageChange)="onPageChange($event)"
            (entriesChange)="onEntriesChange($event)">
          </app-generic-table>
        </div>
      </div>

    </div>
  </div>
</div>
