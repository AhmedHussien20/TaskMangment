<app-page-header [title]="title | translate" [title1]="breadcrumbs" [activeitem]="activeitem | translate">
</app-page-header>

<div class="row row-sm">
  <div class="col-md-12 col-lg-12">
    <div class="card custom-card">

      <div class="card-header border-bottom-0">
        <div class="d-flex justify-content-center gap-3 flex-wrap">

          <div class="d-flex flex-column">
            <label class="form-label small">{{ 'CHART.FROM' | translate }}</label>
            <app-date-picker [(ngModel)]="fromDate" [placeholderKey]="'REPORTS.FROM'">
            </app-date-picker>
          </div>

          <div class="d-flex flex-column">
            <label class="form-label small">{{ 'CHART.TO' | translate }}</label>
            <app-date-picker [(ngModel)]="toDate" [placeholderKey]="'REPORTS.TO'">
            </app-date-picker>
          </div>

          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-primary btn-sm" (click)="onFilterApply()">
              {{ 'COMMON.APPLY' | translate }}
            </button>
          </div>

        </div>
      </div>


      <div class="card-body pt-2">
        <div *ngIf="isLoading" class="text-center my-3">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">{{ 'TABLE.LOADING' | translate }}</span>
          </div>
        </div>

        <div *ngIf="!isLoading">
          <app-generic-table [title]="title" [columns]="columns" [data]="rows" [entries]="entries" [page]="page"
            [showFilters]="false" [showPagination]="false" [showExportPdf]="true" (exportPdfClick)="onExportPdf()"
            [showExportExcel]="false"
            [showExportReportExcel]="true"
            (exportExcelClick)="onExportExcel()">
          </app-generic-table>
        </div>
      </div>
    </div>
  </div>
</div>
