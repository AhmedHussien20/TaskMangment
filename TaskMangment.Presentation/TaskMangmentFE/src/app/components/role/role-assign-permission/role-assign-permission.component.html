<app-generic-form
  [title]="title"
  [breadcrumbs]="breadcrumbs"
  [activeitem]="activeitem"
  [formGroup]="formGroup"
  [formConfig]="formConfig"
  (formSubmit)="onSubmit($event)"> 
</app-generic-form>

<div class="mt-3 d-flex justify-content-end">
  <button type="button" class="btn btn-secondary me-2" (click)="onCancel()">
    {{ 'FORM.BACK' | translate }}
  </button>
</div>
