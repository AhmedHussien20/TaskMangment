<app-page-header [title]="title | translate" [title1]="breadcrumbs" [activeitem]="activeitem | translate">
</app-page-header>

<div class="row row-sm">
  <div class="col-md-12 col-lg-12">
    <div class="card custom-card">

      <div class="card-header border-bottom-0">
        <div class="d-flex justify-content-between align-items-center">
          <label class="main-content-label my-auto pt-2">{{ title | translate }}</label>
          
          <button class="btn btn-success btn-sm" (click)="openAdd(roleModal)">
            <i class="fa fa-plus"></i> {{ 'ROLE.ADD_ROLE' | translate }}
          </button>
        </div>
      </div>

      <div class="card-body pt-2">

        <!-- LOADING -->
        <div *ngIf="isLoading" class="text-center my-3">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">{{ 'TABLE.LOADING' | translate }}</span>
          </div>
        </div>

        <!-- TABLE -->
        <div *ngIf="!isLoading && rows.length > 0">
          <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th *ngFor="let col of columns">
                    {{ col.label | translate }}
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of rows">
                  <td>{{ item.id }}</td>
                  <td>{{ item.name }}</td>
                  <td>{{ item.description || '-' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- NO DATA -->
        <div *ngIf="!isLoading && rows.length === 0" class="text-center text-muted py-5">
          <i class="bi bi-inbox fa-3x mb-3"></i>
          <p>{{ 'TABLE.NO_DATA' | translate }}</p>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- MODAL TEMPLATE -->
<ng-template #roleModal let-modal>
  <div class="modal-header">
    <h6 class="modal-title">
      {{ 'ROLE.CREATE_TITLE' | translate }}
    </h6>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <app-role-create-update (formSubmitted)="onFormSubmitted()"></app-role-create-update>
  </div>
</ng-template>
