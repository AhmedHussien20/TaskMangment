<div class="modal-header">
  <h6 class="modal-title">
    {{ 'TASK.EXTEND_REQUEST_TITLE' | translate }} / {{ taskId }}
  </h6>
  <button class="btn-close" (click)="modal.dismiss()"></button>
</div>

<div class="modal-body">

  <div class="alert alert-success text-center">
    {{ 'TASK.EXTEND_REQUEST_NOTE' | translate }}
  </div>

  <div class="mb-3">
    <label class="form-label">
      {{ 'TASK.MESSAGE' | translate }}
    </label>

    <textarea
      class="form-control"
      rows="4"
      [(ngModel)]="reason"
      [placeholder]="'TASK.EXTEND_REQUEST_PLACEHOLDER' | translate">
    </textarea>
  </div>

</div>

<div class="modal-footer justify-content-between">

  <button
    class="btn btn-light"
    data-bs-dismiss="modal">
    {{ 'COMMON.CANCEL' | translate }}
  </button>

  <button
    class="btn btn-danger">
    {{ 'COMMON.DELETE' | translate }}
  </button>

  <button
    class="btn btn-success"
    (click)="submit()">
    {{ 'COMMON.SEND' | translate }}
  </button>

</div>
