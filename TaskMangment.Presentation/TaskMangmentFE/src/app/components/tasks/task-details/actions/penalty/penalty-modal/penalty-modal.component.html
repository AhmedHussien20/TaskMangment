<div class="modal-header">
      <h6>{{ 'TASK.ADD_PENALTY' | translate }}</h6>
      <button class="btn-close" (click)="modal.dismiss()"></button>
    </div>


<div class="modal-body">

  <!-- Employee Dropdown -->
  <div class="mb-3">
    <label class="form-label">{{ 'TASK.ASSIGNED_EMPLOYEES' | translate }}</label>
    <select
      class="form-select"
      [(ngModel)]="selectedEmployeeId">
      <option [ngValue]="null" disabled>
        {{ 'TASK.SELECT_EMPLOYEE' | translate }}
      </option>
      <option *ngFor="let emp of employees" [ngValue]="emp.id">
        {{ emp.fullName }}
      </option>
    </select>
  </div>
</div>
    <div class="modal-body">
      <input class="form-control mb-2" type="number"
        [(ngModel)]="amount"
        placeholder="{{ 'TASK.PENALTY_AMOUNT' | translate }}" />

      <textarea class="form-control" rows="3"
        [(ngModel)]="reason"
        placeholder="{{ 'TASK.PENALTY_REASON' | translate }}">
      </textarea>
    </div>
    

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="modal.dismiss()">
        {{ 'FORM.CANCEL' | translate }}
      </button>
      <button class="btn btn-danger" (click)="submit()">
        {{ 'FORM.SAVE' | translate }}
      </button>
    </div>
