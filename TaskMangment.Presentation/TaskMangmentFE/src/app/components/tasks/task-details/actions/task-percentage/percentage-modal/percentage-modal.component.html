<form [formGroup]="form">

  <div class="modal-header">
    <h6 class="modal-title">{{ 'TASK.ADD_PERCENTAGE' | translate }}</h6>
    <button class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">

    <div class="alert alert-warning mb-3">
      {{ 'TASK.ACHIEVEMENT_INFO' | translate }}
    </div>

    <div class="mb-3">
      <label class="form-label">{{ 'TASK.ADD_ACHIEVEMENT' | translate }}</label>
      <div class="input-group">
        <input type="number"
               class="form-control"
               formControlName="achievementPercent"
               placeholder="{{ 'TASK.PERCENTAGE_PLACEHOLDER' | translate }}"
               />
        <span class="input-group-text">%</span>
      </div>

      <div class="text-danger small mt-1"
           *ngIf="form.controls['achievementPercent'].touched && form.controls['achievementPercent'].invalid">
        <div *ngIf="form.controls['achievementPercent'].errors?.['required']">
          {{ 'TASK.REQUIRED_FIELD' | translate }}
        </div>
        <div *ngIf="form.controls['achievementPercent'].errors?.['pattern']">
          {{ 'TASK.INVALID_PERCENT' | translate }}
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">{{ 'TASK.ACHIEVEMENT_RESON' | translate }}</label>
      <textarea class="form-control"
                rows="3"
                formControlName="achievementReason"
                placeholder="{{ 'TASK.ACHIEVEMENT_RESON' | translate }}">
      </textarea>

      <div class="text-danger small mt-1"
           *ngIf="form.controls['achievementReason'].touched && form.controls['achievementReason'].invalid">
        <div *ngIf="form.controls['achievementReason'].errors?.['required']">
          {{ 'TASK.REQUIRED_FIELD' | translate }}
        </div>
        <div *ngIf="form.controls['achievementReason'].errors?.['minlength']">
          {{ 'TASK.MIN_LENGTH_TASK_CHARACTERS' | translate }}
        </div>
      </div>
    </div>

  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">
      {{ 'FORM.CANCEL' | translate }}
    </button>

    <button class="btn btn-danger"
            [disabled]="form.invalid || isSubmitting"
            (click)="submit()">
      {{ 'TASK.SUBMIT_PERCENTAGE' | translate }}
    </button>
  </div>

</form>
