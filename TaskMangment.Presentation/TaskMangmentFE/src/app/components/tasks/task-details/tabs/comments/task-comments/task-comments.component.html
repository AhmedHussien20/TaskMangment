<div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
  <table class="table table-bordered align-middle">
    <thead class="table-light" style="position: sticky; top: 0; z-index: 10;">
      <tr>
        <th>#</th>
        <th>المرسل</th>
        <th>التاريخ</th>
        <th>التعليق</th>
        <th>الوقت المنقضي</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let c of comments">
        <td>{{ c.id }}</td>
        <td>{{ c.employeeName }}</td>
        <td>
          <span class="badge bg-success">{{ c.timeLabel }}</span>
          <br />
          <small class="text-muted">{{ c.createdDate | date:'yyyy-MM-dd' }}</small>
        </td>
        <td>
          <span class="badge bg-secondary mb-1">تعليق</span>
          <p class="mb-1">{{ c.commentText }}</p>
        </td>
        <td class="text-muted">
          {{ timeAgo(c.createdDate) }}
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="!comments.length" class="text-center text-muted mt-3">
  لا يوجد تعليقات حتى الآن
</div>
