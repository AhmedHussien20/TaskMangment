
<div class="card position-relative">
  <button
    type="button"
    class="btn-close position-absolute top-0 end-0 m-2"
    aria-label="Close"
    (click)="modall.dismiss()">
  </button>


<div class="card-body">
    <!-- HEADER -->
    <app-page-header
      [title]="'TASK.TASK_DETAILS' | translate"
      [title1]="['TASKS']"
      [activeitem]="'TASK.TASK_DETAILS' | translate">
    </app-page-header>

    <!-- ACTION ICONS -->
    <div class="d-flex justify-content-center gap-4 mb-3">

      <button class="btn btn-light" (click)="openAction('comment')">
        <i class="bi bi-chat-dots"></i>
      </button>

      <button class="btn btn-light" (click)="openAction('close')">
        <i class="bi bi-x-square"></i>
      </button>

      <button class="btn btn-light" (click)="openAction('extend')">
        <i class="bi bi-clock-history"></i>
      </button>

      <button class="btn btn-light" (click)="openAction('warning')">
        <i class="bi bi-exclamation-triangle"></i>
      </button>

      <button class="btn btn-light" (click)="openAction('penalty')">
        <i class="bi bi-cash-coin"></i>
      </button>

    </div>

    <!-- TABS -->
    <app-task-tabs
      [taskId]="taskId"
      [readonly]="readonly">
    </app-task-tabs>

  </div>
</div>
