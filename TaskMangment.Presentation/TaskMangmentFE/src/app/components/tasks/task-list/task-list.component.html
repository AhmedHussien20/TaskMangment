<app-page-header [title]="title | translate" [title1]="breadcrumbs" [activeitem]="activeitem | translate">
</app-page-header>

<div class="row row-sm">
  @for (card of cards; track $index) {
    <div class="col-12 col-md-6 col-xl-3">
      <spk-dashboard [card]="card"></spk-dashboard>
    </div>
  }
</div>

<div class="row row-sm">
  <div class="col-md-12 col-lg-12">
    <div class="card custom-card">
      <div class="card-body pt-2">
        <div>
          <app-generic-table
  [title]="title"
  [breadcrumbs]="breadcrumbs"
  [columns]="columns"
  [data]="rows"
  [entries]="entries"
  [page]="page"
  [labels]="labels"
  [totalItems]="totalItems"
  [showAddButton]="canCreate"
  [showEditButton]="canEdit"
  [showDeleteButton]="canDelete"
  (addClick)="openAdd(taskModal)"
  [showDetailsButton]="true"
  [showFilters]="true"
  [searchCriteria]="searchCriteria"
  [onSearch]="applyFilters.bind(this)"
  [statusOptions]="status"
  [showEmployeeFilter]="showEmployeeFilter"
  (pageChange)="onPageChange($event)"
  [addButtonLabel]="'TASK.ADD' | translate"
  (edit)="openEdit($event, taskModal)"
  (details)="openDetails($event)"
  (delete)="confirmDelete($event)"
  [disableEditFn]="disableEditRow"
  [disableDeleteFn]="disableDeleteRow"
  [showExtraButton]="canShowExtraTasks"
  [extraMenuItems]="extraMenuItems"
  (extraMenuSelect)="onExtraMenuSelect($event, deepSearchModal)">
</app-generic-table>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- TASK MODAL -->
<ng-template #taskModal let-modal>
  <div class="modal-header">
    <h6 class="modal-title">
      {{ isEdit ? ('TASK.EDIT' | translate) : ('TASK.ADD' | translate) }}
    </h6>
    <button class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <app-task-create-update
      [isEdit]="isEdit"
      [taskId]="selectedTaskId"
      (formSubmitted)="onFormSubmitted()">
    </app-task-create-update>
  </div>
</ng-template>

<!-- DEEP SEARCH MODAL -->
<ng-template #deepSearchModal let-modal>
  <div class="modal-header">
    <h6 class="modal-title">
        {{ deepSearchTitleKey | translate }}
    </h6>
    <button class="btn-close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <app-tasks-employee-deep-search
      [statusOptions]="statusOptions"
      [initial]="deepSearchInitial"
      (submitFilters)="applyDeepSearch($event, modal)"
      (cancel)="modal.dismiss()">
    </app-tasks-employee-deep-search>
  </div>
</ng-template>
