<app-page-header
  [title]="'PLATFORM.ADMINS'"
  [title1]="['PLATFORM.TITLE', 'PLATFORM.ADMINS']"
  [activeitem]="'PLATFORM.ADMINS'">
</app-page-header>

<div class="row row-sm">
  <div class="col-md-12">
    <div class="card custom-card">
      <app-generic-table
        [title]="'PLATFORM.ADMINS'"
        [columns]="columns"
        [data]="rows"
        [entries]="entries"
        [page]="page"
        [totalItems]="total"
        [labels]="labels"
        [searchCriteria]="criteria"
        [extraFilterOptions]="{ status: statusOptions }"
        [showAddButton]="true"
        [addButtonLabel]="'PLATFORM.NEW_ADMIN'"
        [showFilters]="true"
        [showPagination]="true"
        [showExportExcel]="false"
        [onSearch]="applyFilters.bind(this)"
        (pageChange)="onPageChange($event)"
        (entriesChange)="onEntriesChange($event)"
        (iconAction)="onAction($event)"
        (addClick)="openCreate(adminModal)">
      </app-generic-table>
    </div>
  </div>
</div>

<ng-template #adminModal let-modal>
  <div class="modal-header">
    <h6 class="modal-title">{{ modalTitle | translate }}</h6>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <app-generic-form
      [formGroup]="form"
      [formConfig]="formConfig"
      (formSubmit)="save()">
    </app-generic-form>
  </div>
</ng-template>
