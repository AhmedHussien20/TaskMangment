<div class="login-wrapper">
  <div class="top-logos">
    <div class="logos-marquee">
      <div class="logos-track">
        <img src="assets/logos/1.png" alt="">
        <img src="assets/logos/2.png" alt="">
        <img src="assets/logos/3.png" alt="">
        <img src="assets/logos/4.png" alt="">
        <img src="assets/logos/5.png" alt="">
        <img src="assets/logos/6.png" alt="">
        <img src="assets/logos/7.png" alt="">
        <img src="assets/logos/8.png" alt="">
        <img src="assets/logos/9.png" alt="">
        <img src="assets/logos/1.png" alt="">
        <img src="assets/logos/2.png" alt="">
        <img src="assets/logos/3.png" alt="">
        <img src="assets/logos/4.png" alt="">
        <img src="assets/logos/5.png" alt="">
        <img src="assets/logos/6.png" alt="">
        <img src="assets/logos/7.png" alt="">
        <img src="assets/logos/8.png" alt="">
        <img src="assets/logos/9.png" alt="">
      </div>
    </div>
  </div>

  <div class="login-page gradient-bg d-flex flex-column align-items-center justify-content-center">
    <div class="login-card shadow-lg rounded-4 p-4 p-md-5 bg-body">
      <h3 class="fw-bold mb-1 text-center">{{ 'PLATFORM.TITLE' | translate }}</h3>
      <p class="text-muted text-center mb-4 fs-14">{{ 'PLATFORM.SUBTITLE' | translate }}</p>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label fw-semibold">{{ 'PLATFORM.EMAIL' | translate }}</label>
          <input type="email" formControlName="email" class="form-control form-control-lg"
            [placeholder]="'PLATFORM.EMAIL_PLACEHOLDER' | translate"
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">{{ 'PLATFORM.PASSWORD' | translate }}</label>
          <div class="position-relative">
            <input [type]="showLoginPassword ? 'text' : 'password'" formControlName="password"
              class="form-control form-control-lg pe-5" [placeholder]="'PLATFORM.PASSWORD_PLACEHOLDER' | translate"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <i class="fe position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer"
              [class.fe-eye]="!showLoginPassword" [class.fe-eye-off]="showLoginPassword"
              (click)="showLoginPassword = !showLoginPassword"></i>
          </div>
        </div>

        <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>

        <button class="btn btn-primary btn-lg w-100 mt-2" [disabled]="loginForm.invalid || loading">
          <span *ngIf="!loading">{{ 'PLATFORM.LOGIN' | translate }}</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        </button>
      </form>

      <div class="text-center mt-4">
        <a routerLink="/auth/login" class="d-block">{{ 'PLATFORM.COMPANY_LOGIN' | translate }}</a>
      </div>
    </div>

    <div class="bottom-logos">
      <div class="logos-marquee">
        <div class="logos-track">
          <img src="assets/logos/1.png" alt="">
          <img src="assets/logos/2.png" alt="">
          <img src="assets/logos/3.png" alt="">
          <img src="assets/logos/4.png" alt="">
          <img src="assets/logos/5.png" alt="">
          <img src="assets/logos/6.png" alt="">
          <img src="assets/logos/7.png" alt="">
          <img src="assets/logos/8.png" alt="">
          <img src="assets/logos/9.png" alt="">
          <img src="assets/logos/1.png" alt="">
          <img src="assets/logos/2.png" alt="">
          <img src="assets/logos/3.png" alt="">
          <img src="assets/logos/4.png" alt="">
          <img src="assets/logos/5.png" alt="">
          <img src="assets/logos/6.png" alt="">
          <img src="assets/logos/7.png" alt="">
          <img src="assets/logos/8.png" alt="">
          <img src="assets/logos/9.png" alt="">
        </div>
      </div>
    </div>
  </div>
</div>
